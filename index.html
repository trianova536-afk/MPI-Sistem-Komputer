    <script>
        tailwind.config = {
            theme: {

                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],

                        'float': 'float 3.5s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2.5s infinite',
                        'data-flow': 'dataFlow 2s linear infinite',

    <!-- ================= SCRIPT UTAMA APLIKASI ================= -->
    <script>
        /* =========================================================================
           1. SISTEM AUDIO TERPADU (Web Audio API untuk SFX/BGM + SpeechSynthesis)
           ========================================================================= */
        const AudioEngine = {
            ctx: null,
            bgmInterval: null,
            bgmPlaying: false,
            sfxEnabled: true,
            volume: 0.8,
            synth: window.speechSynthesis || null,
            isSpeaking: false,

            initCtx() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            setVolume(val) {
                this.volume = parseFloat(val);
            },

            toggleSFX() {
                this.sfxEnabled = !this.sfxEnabled;
                const icon = document.getElementById('icon-sfx');
                icon.className = this.sfxEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-400';
                if (this.sfxEnabled) this.playClick();
            },

            playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
                if (!this.sfxEnabled) return;
                try {
                    this.initCtx();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(this.volume * 0.25, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch (e) {}
            },

            playClick() {
                this.playTone(620, 'triangle', 0.08, 0);
            },

            playCorrect() {
                this.playTone(523.25, 'sine', 0.12, 0);      // C5
                this.playTone(659.25, 'sine', 0.12, 0.1);    // E5
                this.playTone(783.99, 'sine', 0.25, 0.2);    // G5
            },

            playWrong() {
                this.playTone(260, 'sawtooth', 0.18, 0);
                this.playTone(210, 'sawtooth', 0.25, 0.15);
            },

            playVictory() {
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                notes.forEach((n, i) => this.playTone(n, 'triangle', 0.18, i * 0.12));
            },

            toggleBGM() {
                this.initCtx();
                const btnText = document.getElementById('text-bgm');
                const btn = document.getElementById('btn-bgm');
                if (this.bgmPlaying) {
                    clearInterval(this.bgmInterval);
                    this.bgmPlaying = false;
                    if (btnText) btnText.textContent = 'Musik: OFF';
                    btn.classList.remove('bg-purple-600', 'text-white');
                } else {
                    this.bgmPlaying = true;
                    if (btnText) btnText.textContent = 'Musik: ON';
                    btn.classList.add('bg-purple-600', 'text-white');
                    // Melodi chiptune futuristik lembut
                    const melody = [261.63, 329.63, 392.00, 493.88, 392.00, 329.63, 293.66, 392.00];
                    let step = 0;
                    this.bgmInterval = setInterval(() => {
                        if (!this.bgmPlaying || !this.ctx) return;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(melody[step % melody.length], this.ctx.currentTime);
                        gain.gain.setValueAtTime(this.volume * 0.04, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.45);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.45);
                        step++;
                    }, 500);
                }
            },

            speak(text) {
                if (!this.synth) {
                    showToast('Browser Anda tidak mendukung fitur narasi suara otomatis.');
                    return;
                }
                this.synth.cancel();
                const cleanText = text.replace(/<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'id-ID';
                utterance.rate = 0.98;
                utterance.pitch = 1.05;
                utterance.volume = this.volume;

                // Cari suara Bahasa Indonesia jika tersedia
                const voices = this.synth.getVoices();
                const idVoice = voices.find(v => v.lang.includes('id'));
                if (idVoice) utterance.voice = idVoice;

                utterance.onstart = () => {
                    this.isSpeaking = true;
                    updateSpeechUI(true);
                };
                utterance.onend = () => {
                    this.isSpeaking = false;
                    updateSpeechUI(false);
                };
                utterance.onerror = () => {
                    this.isSpeaking = false;
                    updateSpeechUI(false);
                };
                this.synth.speak(utterance);
            },

            pauseSpeech() {
                if (this.synth && this.synth.speaking) {
                    this.synth.pause();
                }
            },

            resumeSpeech() {
                if (this.synth && this.synth.paused) {
                    this.synth.resume();
                }
            },

            stopSpeech() {
                if (this.synth) {
                    this.synth.cancel();
                    this.isSpeaking = false;
                    updateSpeechUI(false);
                }
            }
        };

        function updateSpeechUI(speaking) {
            const badge = document.getElementById('narration-status');
            if (badge) {
                badge.innerHTML = speaking 
                    ? '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-1.5"></span> Membacakan materi...'
                    : '<i class="fa-solid fa-headphones mr-1"></i> Siap membacakan';
            }
        }

        /* =========================================================================
           2. MANAJEMEN PROGRES & PENYIMPANAN (localStorage)
           ========================================================================= */
        const DefaultProgress = {
            materiDone: [false, false, false, false, false],
            simulasiDone: false,
            praktikumDone: [false, false, false, false],
            gamesDone: [false, false, false, false],
            lkpdDone: false,
            evalScore: null,
            stars: 0,
            xp: 0
        };

        let userProgress = JSON.parse(localStorage.getItem('cla_progress_2026')) || JSON.parse(JSON.stringify(DefaultProgress));

        function saveProgress() {
            // Hitung ulang bintang & XP otomatis berdasarkan pencapaian
            let stars = 0;
            let xp = 0;
            userProgress.materiDone.forEach(d => { if (d) { stars += 1; xp += 100; } });
            if (userProgress.simulasiDone) { stars += 2; xp += 150; }
            userProgress.praktikumDone.forEach(d => { if (d) { stars += 1; xp += 120; } });
            userProgress.gamesDone.forEach(d => { if (d) { stars += 2; xp += 150; } });
            if (userProgress.lkpdDone) { stars += 2; xp += 200; }
            if (userProgress.evalScore !== null && userProgress.evalScore >= 75) { stars += 3; xp += 300; }

            userProgress.stars = stars;
            userProgress.xp = xp;
            localStorage.setItem('cla_progress_2026', JSON.stringify(userProgress));
            updateHeaderStats();
        }

        function getOverallPercentage() {
            let totalTasks = 16; // 5 materi + 1 simulasi + 4 praktikum + 4 game + 1 lkpd + 1 evaluasi
            let done = 0;
            done += userProgress.materiDone.filter(Boolean).length;
            if (userProgress.simulasiDone) done++;
            done += userProgress.praktikumDone.filter(Boolean).length;
            done += userProgress.gamesDone.filter(Boolean).length;
            if (userProgress.lkpdDone) done++;
            if (userProgress.evalScore !== null) done++;
            return Math.round((done / totalTasks) * 100);
        }

        function updateHeaderStats() {
            document.getElementById('header-stars').textContent = userProgress.stars;
            document.getElementById('header-xp').textContent = userProgress.xp + ' XP';
        }

        /* =========================================================================
           3. ILUSTRASI SVG PERANGKAT KOMPUTER (Kualitas Tinggi & Tajam)
           ========================================================================= */
        const DeviceSVGs = {
            komputerSet: `<svg viewBox="0 0 240 150" class="w-full h-36 mx-auto">
                <rect x="25" y="15" width="110" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
                <rect x="33" y="23" width="94" height="58" rx="4" fill="#0f172a"/>
                <circle cx="80" cy="52" r="14" fill="#06b6d4" opacity="0.3"/>
                <path d="M72 52L78 58L90 46" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
                <path d="M68 90L62 108H98L92 90" fill="#64748b"/>
                <rect x="52" y="108" width="56" height="6" rx="3" fill="#94a3b8"/>
                <!-- CPU Tower -->
                <rect x="150" y="15" width="48" height="100" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
                <circle cx="174" cy="35" r="6" fill="#22d3ee"/>
                <rect x="160" y="50" width="28" height="6" rx="2" fill="#475569"/>
                <rect x="160" y="62" width="28" height="6" rx="2" fill="#475569"/>
                <!-- Keyboard & Mouse -->
                <rect x="25" y="120" width="105" height="18" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
                <rect x="142" y="120" width="22" height="18" rx="9" fill="#334155" stroke="#a855f7" stroke-width="2"/>
            </svg>`,

            keyboard: `<svg viewBox="0 0 160 100" class="w-28 h-20 mx-auto">
                <rect x="10" y="20" width="140" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
                <g fill="#38bdf8" opacity="0.85">
                    <rect x="20" y="30" width="12" height="10" rx="2"/><rect x="36" y="30" width="12" height="10" rx="2"/>
                    <rect x="52" y="30" width="12" height="10" rx="2"/><rect x="68" y="30" width="12" height="10" rx="2"/>
                    <rect x="84" y="30" width="12" height="10" rx="2"/><rect x="100" y="30" width="12" height="10" rx="2"/>

        function inspectSimComponent(key) {
            AudioEngine.playClick();
            const info = SimComponentInfo[key];
            document.getElementById('sim-detail-title').textContent = `${info.name} — [${info.role}]`;
            document.getElementById('sim-detail-desc').textContent = info.desc;
        }

        function selectSimKeyboard() {
            AudioEngine.playCorrect();
            inspectSimComponent('keyboard');
            const input = document.getElementById('sim-input-field');
            input.disabled = false;
            input.focus();
            document.getElementById('node-keyboard').classList.add('ring-4', 'ring-cyan-400');
            document.getElementById('sim-instruction').innerHTML = 'Langkah 2: Sekarang ketik kata <strong class="text-amber-300">INFORMATIKA</strong> pada kotak ketik di samping!';
        }

        function handleSimTyping(val) {
            const clean = val.toUpperCase();
            document.getElementById('sim-input-field').value = clean;
            if (!clean) return;

            AudioEngine.playTone(750, 'sine', 0.05);
            // Tampilkan aliran ke Keyboard -> CPU -> Monitor
            document.getElementById('packet-1').classList.remove('hidden');
            document.getElementById('pkt-text-1').textContent = clean;

            document.getElementById('node-cpu').classList.add('ring-4', 'ring-purple-500');
            document.getElementById('cpu-status-text').textContent = 'Memproses biner: ' + clean.length + ' karakter...';
            document.getElementById('packet-2').classList.remove('hidden');

            document.getElementById('node-monitor').classList.add('ring-4', 'ring-emerald-400');
            document.getElementById('monitor-screen-text').textContent = clean;

            if (clean === 'INFORMATIKA') {
                AudioEngine.playCorrect();
                document.getElementById('sim-btn-save').disabled = false;
                document.getElementById('sim-instruction').innerHTML = 'Langkah 3: Kata <strong>INFORMATIKA</strong> tampil di Monitor! Klik tombol <strong class="text-amber-300">Simpan ke SSD</strong>!';
                setRobotMessage('Keren! Data sudah diproses CPU dan tampil di Monitor. Sekarang simpan datanya ke SSD!');
            }
        }

        function triggerSaveSSD() {
            AudioEngine.playVictory();
            inspectSimComponent('ssd');

        function startAutoSimulasi() {
            resetSimulasi();
            AudioEngine.speak('Simulasi dimulai. Pertama, keyboard dipilih sebagai alat input dan mengetik kata INFORMATIKA. Data mengalir ke CPU untuk diproses, lalu ditampilkan di layar monitor, dan akhirnya disimpan secara permanen di dalam SSD.');
            selectSimKeyboard();
            const targetWord = 'INFORMATIKA';
            let idx = 0;
            simState.timer = setInterval(() => {
                if (simState.paused) return;
                if (idx < targetWord.length) {
                    const currentStr = targetWord.slice(0, idx + 1);
                    document.getElementById('sim-input-field').value = currentStr;
                    handleSimTyping(currentStr);
                    idx++;
                } else {
                    clearInterval(simState.timer);
                    setTimeout(() => {
                        if (!simState.paused) triggerSaveSSD();
                    }, 600);
                }
            }, 320);
        }

            simState.paused = !simState.paused;

        // Helper Drag-and-Drop & Tap-to-Move (Ramah Mobile & Desktop)

            ev.dataTransfer.setData('text/plain', ev.target.id);
        }
        function dropToZone(ev, zoneEl) {
            ev.preventDefault();
            const id = ev.dataTransfer.getData('text/plain');
            const chip = document.getElementById(id);
            if (chip) zoneEl.querySelector('.zone-items').appendChild(chip);
        }
        function selectTouchChip(chip) {
            AudioEngine.playClick();
            if (selectedChip) selectedChip.classList.remove('ring-4', 'ring-amber-300');
            selectedChip = chip;
            chip.classList.add('ring-4', 'ring-amber-300');
        }
        function tapToZone(zoneEl) {
            if (selectedChip) {
                AudioEngine.playTone(600, 'sine', 0.08);
                selectedChip.classList.remove('ring-4', 'ring-amber-300');
                zoneEl.querySelector('.zone-items').appendChild(selectedChip);
                selectedChip = null;
            }
        }

        function gradePrak1() {
            const ans = { p1_1: 'Scanner', p1_2: 'RAM', p1_3: 'SSD', p1_4: 'Speaker' };
            let score = 0;
            Object.keys(ans).forEach(k => { if (document.getElementById(k).value === ans[k]) score += 25; });
            const res = document.getElementById('prak1-result');
            if (score === 100) {
                AudioEngine.playCorrect();
                userProgress.praktikumDone[0] = true; saveProgress();
                res.innerHTML = `<span class="text-emerald-400">Nilai: 100/100! Sempurna! Semua perangkat teridentifikasi dengan benar.</span>`;
            } else {
                AudioEngine.playWrong();
                res.innerHTML = `<span class="text-amber-300">Nilai: ${score}/100. Pembahasan: 1. Scanner, 2. RAM, 3. SSD, 4. Speaker. Coba perbaiki ya!</span>`;
            }
        }

        function gradePrak2() {
            const zones = document.querySelectorAll('[data-zone]');
            let correct = 0;
            zones.forEach(z => {
                const expected = z.getAttribute('data-zone');
                z.querySelectorAll('[data-cat]').forEach(chip => {
                    if (chip.getAttribute('data-cat') === expected) correct++;
                });
            });
            const score = Math.round((correct / 8) * 100);
            const res = document.getElementById('prak2-result');
            if (correct === 8) {
                AudioEngine.playCorrect();
                userProgress.praktikumDone[1] = true; saveProgress();
                res.innerHTML = `<span class="text-emerald-400">Nilai: 100/100! Semua 8 perangkat dikelompokkan dengan tepat!</span>`;
            } else {
                AudioEngine.playWrong();
                res.innerHTML = `<span class="text-amber-300">Nilai: ${score}/100 (${correct}/8 benar). Pembahasan: Input (Keyboard, Mouse), Process (CPU, RAM), Output (Monitor, Printer), Storage (SSD, Flashdisk).</span>`;
            }
        }

        function gradePrak3() {
            const keys = ['Software', 'Hardware', 'Software', 'Hardware', 'Software', 'Hardware'];
            let correct = 0;
            keys.forEach((k, i) => {
                const checked = document.querySelector(`input[name="p3_${i}"]:checked`);
                if (checked && checked.value === k) correct++;
            });
            const score = Math.round((correct / 6) * 100);
            const res = document.getElementById('prak3-result');
            if (correct === 6) {
                AudioEngine.playCorrect();
                userProgress.praktikumDone[2] = true; saveProgress();
                res.innerHTML = `<span class="text-emerald-400">Nilai: 100/100! Hebat, kamu bisa membedakan Hardware & Software!</span>`;

            }

            // Periksa tabel klasifikasi & alur
            const expectedCats = ['Input', 'Process', 'Output', 'Storage'];
            let catCorrect = 0;
            expectedCats.forEach((c, i) => {
                if (document.getElementById(`lkpd-cat-${i}`).value === c) catCorrect++;
            });

            let flowCorrect = 0;
            expectedCats.forEach((c, i) => {
                if (document.getElementById(`lkpd-flow-${i + 1}`).value === c) flowCorrect++;
            });

            const autoScore = Math.round(((catCorrect + flowCorrect) / 8) * 100);
            AudioEngine.playCorrect();
            userProgress.lkpdDone = true;
            saveProgress();

            fb.className = 'p-4 rounded-2xl text-sm font-medium bg-emerald-950/90 border border-emerald-400 text-emerald-200';
            fb.innerHTML = `
                <div class="font-bold text-base mb-1"><i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> LKPD Digital Berhasil Diperiksa!</div>
                <p>Siswa: <strong>${nama}</strong> (${kelas}) • Ketepatan Klasifikasi & Alur Otomatis: <strong>${autoScore}%</strong> (${catCorrect + flowCorrect}/8 tepat). Silakan klik tombol <strong>Cetak</strong> atau <strong>Unduh Hasil</strong> untuk dikumpulkan kepada Ibu Irdyana Listya, S.Kom.</p>
            `;
            setRobotMessage('Mantap! LKPD Digitalmu sudah diperiksa dan tersimpan di progres belajar.');
        }

        function downloadLKPD() {
            const nama = document.getElementById('lkpd-nama').value.trim() || 'Siswa_SMPN2_Kalianda';
            const kelas = document.getElementById('lkpd-kelas').value.trim() || 'VII';
            const absen = document.getElementById('lkpd-absen').value.trim() || '-';
            const pengamatan = document.getElementById('lkpd-pengamatan').value;
            const tanya = document.getElementById('lkpd-tanya').value;
            const kesimpulan = document.getElementById('lkpd-kesimpulan').value;
            const refleksi = document.getElementById('lkpd-refleksi').value;

            const content = `============================================================
HASIL LKPD DIGITAL - COMPUTER LAB ADVENTURE
Mata Pelajaran : Informatika Kelas VII (Fase D)
Sekolah        : SMP Negeri 2 Kalianda
Guru Pengampu  : Irdyana Listya, S.Kom.
============================================================
Nama Siswa     : ${nama}
Kelas / Absen  : ${kelas} / ${absen}

A. PENGAMATAN PERANGKAT KOMPUTER:
${pengamatan}

B. KLASIFIKASI HARDWARE:
1. Keyboard : ${document.getElementById('lkpd-cat-0').value} - ${document.getElementById('lkpd-fn-0').value}
2. CPU      : ${document.getElementById('lkpd-cat-1').value} - ${document.getElementById('lkpd-fn-1').value}
3. Monitor  : ${document.getElementById('lkpd-cat-2').value} - ${document.getElementById('lkpd-fn-2').value}
4. SSD      : ${document.getElementById('lkpd-cat-3').value} - ${document.getElementById('lkpd-fn-3').value}

C. ALUR KERJA KOMPUTER:
1. ${document.getElementById('lkpd-flow-1').value} -> 2. ${document.getElementById('lkpd-flow-2').value} -> 3. ${document.getElementById('lkpd-flow-3').value} -> 4. ${document.getElementById('lkpd-flow-4').value}

D. PERTANYAAN PEMAHAMAN:
${tanya}

E. KESIMPULAN:
${kesimpulan}

F. REFLEKSI PEMBELAJARAN:
${refleksi}
============================================================`;

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LKPD_Informatika_${nama.replace(/\s+/g, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            AudioEngine.playCorrect();
        }

        /* =========================================================================
           13. MENU EVALUASI (15 SOAL PILIHAN GANDA + 1 SOAL PER HALAMAN + PEMBAHASAN)
           ========================================================================= */
        let evalState = {
            started: false,
            studentName: '',
            studentClass: '',
            currentIdx: 0,
            answers: new Array(15).fill(null),
            finished: false
        };

        function renderEvaluasi(container) {
            if (!evalState.started) {
                setRobotMessage('Siap menghadapi Evaluasi Akhir? Masukkan Nama dan Kelasmu untuk memulai 15 soal!');
                container.innerHTML = `
                    <div class="glass-panel rounded-3xl p-6 sm:p-8 max-w-xl mx-auto border-2 border-blue-500/40">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 text-white flex items-center justify-center text-3xl shadow-lg mb-3">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <h2 class="font-display text-2xl sm:text-3xl font-bold text-white">Evaluasi Akhir Pembelajaran</h2>
                            <p class="text-xs sm:text-sm text-slate-300 mt-1">15 Soal Pilihan Ganda • Sistem Komputer Kelas VII Fase D</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-cyan-300 mb-1">Nama Lengkap Peserta Didik *</label>
                                <input id="eval-name" type="text" value="${evalState.studentName}" placeholder="Masukkan nama lengkapmu..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-600 text-white text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-cyan-300 mb-1">Kelas *</label>
                                <select id="eval-class" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-600 text-white text-sm">
                                    <option value="">-- Pilih Kelas VII --</option>
                                    <option value="VII A">VII A</option>
                                    <option value="VII B">VII B</option>
                                    <option value="VII C">VII C</option>
                                    <option value="VII D">VII D</option>
                                    <option value="VII E">VII E</option>
                                    <option value="VII F">VII F</option>
                                    <option value="VII G">VII G</option>
                                    <option value="VII H">VII H</option>
                                </select>
                            </div>
                            <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700 text-xs text-slate-300 space-y-1">
                                <div class="font-bold text-amber-300"><i class="fa-solid fa-circle-info mr-1"></i> Ketentuan Evaluasi:</div>
                                <p>• Terdiri dari 15 soal pilihan ganda (A, B, C, D).</p>
                                <p>• Wajib memilih jawaban sebelum melanjutkan ke soal berikutnya.</p>
                                <p>• Rumus Nilai Akhir = (Jumlah Benar ÷ 15) × 100.</p>
                            </div>
                            <button onclick="startEvaluasi()" class="btn-3d w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-display font-bold text-base shadow-lg">
                                Mulai Evaluasi Sekarang <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (evalState.finished) {
                renderEvaluasiResult(container);
                return;
            }

            // Tampilkan 1 soal dalam 1 halaman
            const qObj = EvalQuestions[evalState.currentIdx];
            const selected = evalState.answers[evalState.currentIdx];

            container.innerHTML = `
                <div class="glass-panel rounded-3xl p-5 sm:p-8 max-w-3xl mx-auto border border-cyan-500/40">
                    <!-- Header Nomor Soal & Indikator -->
                    <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-700 pb-4 mb-5">
                        <div>
                            <span class="text-xs font-bold text-cyan-300">${evalState.studentName} (${evalState.studentClass})</span>
                            <div class="text-[11px] text-purple-300 font-semibold">Topik: ${qObj.topic}</div>
                        </div>
                        <span class="px-3.5 py-1.5 rounded-full bg-blue-600/30 border border-blue-400 text-white font-display font-bold text-xs">
                            Soal Nomor ${evalState.currentIdx + 1} dari 15
                        </span>
                    </div>

                    <!-- Indikator Nomor 1-15 -->
                    <div class="flex flex-wrap gap-1.5 mb-6">
                        ${EvalQuestions.map((_, i) => `
                            <span class="w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center ${i === evalState.currentIdx ? 'bg-cyan-400 text-slate-950 ring-2 ring-white' : (evalState.answers[i] !== null ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400')}">
                                ${i + 1}
                            </span>
                        `).join('')}
                    </div>

                    <!-- Teks Soal -->
                    <div class="bg-slate-900/90 p-5 rounded-2xl border border-slate-700 mb-5">
                        <p class="text-base sm:text-lg font-bold text-white leading-relaxed">${evalState.currentIdx + 1}. ${qObj.q}</p>
                    </div>

                    <!-- Pilihan Jawaban A, B, C, D -->
                    <div class="space-y-3">
                        ${qObj.opts.map((opt, oIdx) => `
                            <button onclick="selectEvalOption(${oIdx})" class="w-full text-left p-4 rounded-2xl border-2 transition flex items-center gap-3 ${selected === oIdx ? 'bg-cyan-600/30 border-cyan-400 text-white' : 'bg-slate-800/90 border-slate-700 hover:border-cyan-500/50 text-slate-200'}">
                                <span class="w-8 h-8 shrink-0 rounded-xl flex items-center justify-center font-display font-bold text-sm ${selected === oIdx ? 'bg-cyan-400 text-slate-950' : 'bg-slate-700 text-cyan-300'}">
                                    ${String.fromCharCode(65 + oIdx)}
                                </span>
                                <span class="text-sm sm:text-base font-medium">${opt}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Tombol Navigasi Soal -->
                    <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                        <button onclick="prevEvalQuestion()" ${evalState.currentIdx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm ${evalState.currentIdx === 0 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-700 hover:bg-slate-600 text-white'}">
                            <i class="fa-solid fa-chevron-left mr-1"></i> Sebelumnya
                        </button>

                        <button onclick="nextEvalQuestion()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 text-white font-bold text-xs sm:text-sm shadow-lg">
                            ${evalState.currentIdx === 14 ? 'Selesai & Lihat Nilai <i class="fa-solid fa-flag-checkered ml-1"></i>' : 'Soal Berikutnya <i class="fa-solid fa-chevron-right ml-1"></i>'}
                        </button>
                    </div>
                </div>
            `;
        }

        function startEvaluasi() {
            const name = document.getElementById('eval-name').value.trim();
            const cls = document.getElementById('eval-class').value;
            if (!name || !cls) {
                AudioEngine.playWrong();
                showToast('Harap masukkan Nama Lengkap dan pilih Kelasmu terlebih dahulu!');
                return;
            }
            AudioEngine.playClick();
            evalState.studentName = name;
            evalState.studentClass = cls;
            evalState.started = true;
            evalState.currentIdx = 0;
            evalState.answers = new Array(15).fill(null);
            evalState.finished = false;
            renderEvaluasi(document.getElementById('app-container'));
        }

        function selectEvalOption(oIdx) {
            AudioEngine.playClick();
            evalState.answers[evalState.currentIdx] = oIdx;
            renderEvaluasi(document.getElementById('app-container'));
        }

        function prevEvalQuestion() {
            if (evalState.currentIdx > 0) {
                AudioEngine.playClick();
                evalState.currentIdx--;
                renderEvaluasi(document.getElementById('app-container'));
            }
        }

        function nextEvalQuestion() {
            if (evalState.answers[evalState.currentIdx] === null) {
                AudioEngine.playWrong();
                showToast('Kamu wajib memilih salah satu jawaban (A, B, C, atau D) sebelum melanjutkan!');
                return;
            }
            AudioEngine.playClick();
            if (evalState.currentIdx < 14) {
                evalState.currentIdx++;
                renderEvaluasi(document.getElementById('app-container'));
            } else {
                evalState.finished = true;
                renderEvaluasi(document.getElementById('app-container'));
            }
        }

        function renderEvaluasiResult(container) {
            let correctCount = 0;
            EvalQuestions.forEach((q, i) => {
                if (evalState.answers[i] === q.ans) correctCount++;
            });
            // Rumus nilai: jumlah jawaban benar dibagi 15 dikali 100
            const finalScore = Math.round((correctCount / 15) * 100);
            userProgress.evalScore = finalScore;
            saveProgress();

            let predikat = '';
            let badgeColor = '';
            if (finalScore >= 90) {
                predikat = 'SANGAT BAIK (A) — Master Sistem Komputer!';
                badgeColor = 'text-emerald-400 border-emerald-400 bg-emerald-950/60';
                AudioEngine.playVictory();
            } else if (finalScore >= 75) {
                predikat = 'BAIK (B) — Lulus & Kompeten!';
                badgeColor = 'text-cyan-300 border-cyan-400 bg-cyan-950/60';
                AudioEngine.playVictory();
            } else if (finalScore >= 60) {
                predikat = 'CUKUP (C) — Terus Berlatih!';
                badgeColor = 'text-amber-300 border-amber-400 bg-amber-950/60';
                AudioEngine.playCorrect();
            } else {
                predikat = 'PERLU BIMBINGAN (D) — Pelajari Kembali Materi';
                badgeColor = 'text-rose-300 border-rose-400 bg-rose-950/60';
                AudioEngine.playWrong();
            }

            setRobotMessage(`Evaluasi selesai! Nilai akhirmu adalah ${finalScore}. Cek pembahasan setiap soal di bawah ini!`);

            container.innerHTML = `
                <div class="space-y-6 max-w-4xl mx-auto">
                    <!-- Kartu Skor Akhir -->
                    <div class="glass-panel rounded-3xl p-6 sm:p-8 text-center border-2 border-cyan-400">
                        <h2 class="font-display text-2xl sm:text-3xl font-bold text-white">Hasil Evaluasi Sistem Komputer</h2>
                        <p class="text-sm text-cyan-300 mt-1">${evalState.studentName} • Kelas ${evalState.studentClass} • SMP Negeri 2 Kalianda</p>

                        <div class="my-6 inline-flex flex-col items-center justify-center w-36 h-36 rounded-full bg-gradient-to-br from-cyan-500 via-blue-600 to-purple-600 p-1 shadow-2xl">
                            <div class="w-full h-full rounded-full bg-slate-950 flex flex-col items-center justify-center">
                                <span class="text-xs text-slate-400 font-bold">NILAI AKHIR</span>
                                <span class="font-display text-4xl font-bold text-white">${finalScore}</span>
                                <span class="text-[11px] text-cyan-300">${correctCount}/15 Benar</span>
                            </div>
                        </div>

                        <div class="max-w-md mx-auto p-3 rounded-2xl border ${badgeColor} font-display font-bold text-sm sm:text-base">
                            Predikat: ${predikat}
                        </div>

                        <div class="mt-6 flex flex-wrap justify-center gap-3">
                            <button onclick="repeatEvaluasi()" class="px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm shadow">
                                <i class="fa-solid fa-rotate-right mr-1"></i> Ulangi Evaluasi
                            </button>
                            <button onclick="navigateTo('home')" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm">
                                <i class="fa-solid fa-house mr-1"></i> Kembali ke Beranda
                            </button>
                        </div>
                    </div>

                    <!-- Pembahasan Setiap Jawaban -->
                    <div class="glass-panel rounded-3xl p-6 border border-slate-700">
                        <h3 class="font-display text-xl font-bold text-white mb-4"><i class="fa-solid fa-book-open text-cyan-400 mr-1.5"></i> Pembahasan Lengkap 15 Soal</h3>
                        <div class="space-y-4">
                            ${EvalQuestions.map((q, i) => {
                                const userAns = evalState.answers[i];
                                const isRight = userAns === q.ans;
                                return `
                                    <div class="p-4 rounded-2xl bg-slate-900/90 border ${isRight ? 'border-emerald-500/40' : 'border-rose-500/40'}">
                                        <div class="flex items-start justify-between gap-2 mb-1">
                                            <span class="font-bold text-sm text-white">${i + 1}. ${q.q}</span>
                                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold shrink-0 ${isRight ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                                                ${isRight ? 'Benar ✓' : 'Salah ✗'}
                                            </span>
                                        </div>
                                        <p class="text-xs text-slate-300">Jawaban Kamu: <strong class="${isRight ? 'text-emerald-300' : 'text-rose-300'}">${String.fromCharCode(65 + userAns)}. ${q.opts[userAns]}</strong></p>
                                        ${!isRight ? `<p class="text-xs text-emerald-300 mt-0.5">Kunci Jawaban: <strong>${String.fromCharCode(65 + q.ans)}. ${q.opts[q.ans]}</strong></p>` : ''}
                                        <p class="text-xs text-cyan-200 mt-2 bg-slate-800/90 p-2.5 rounded-xl"><i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i> <strong>Pembahasan:</strong> ${q.exp}</p>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function repeatEvaluasi() {
            AudioEngine.playClick();
            evalState.started = false;
            evalState.finished = false;
            evalState.currentIdx = 0;
            evalState.answers = new Array(15).fill(null);
            renderEvaluasi(document.getElementById('app-container'));
        }

        /* =========================================================================
           14. MENU PROFIL PENGEMBANG
           ========================================================================= */
        function renderPengembang(container) {
            setRobotMessage('Ini adalah profil guru pengembang media pembelajaran Computer Lab Adventure SMP Negeri 2 Kalianda!');
            container.innerHTML = `
                <div class="glass-panel rounded-3xl p-6 sm:p-10 max-w-3xl mx-auto border-2 border-purple-500/40 relative overflow-hidden">
                    <div class="absolute -right-12 -top-12 w-48 h-48 bg-cyan-500/20 rounded-full blur-2xl"></div>
                    <div class="flex flex-col md:flex-row items-center gap-6 relative z-10">
                        <!-- Avatar Ilustrasi Guru Informatika -->
                        <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-3xl bg-gradient-to-br from-cyan-400 via-blue-600 to-purple-600 p-1 shadow-2xl shrink-0">
                            <div class="w-full h-full bg-slate-900 rounded-[22px] flex flex-col items-center justify-center text-center p-2">
                                <i class="fa-solid fa-laptop-code text-5xl text-cyan-300 mb-2"></i>
                                <span class="text-[10px] font-bold tracking-wider uppercase text-purple-300">Educator & Developer</span>
                            </div>
                        </div>

                        <div class="flex-1 text-center md:text-left space-y-3">
                            <span class="px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-xs font-bold">PROFIL PENGEMBANG MEDIA PEMBELAJARAN</span>
                            <h2 class="font-display text-2xl sm:text-3xl font-bold text-white">IRDYANA LISTYA, S.Kom.</h2>
                            <p class="text-purple-300 font-semibold text-sm sm:text-base">Guru Mata Pelajaran Informatika • SMP Negeri 2 Kalianda</p>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 text-left text-xs sm:text-sm">
                                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700">
                                    <span class="text-slate-400 block text-[11px]">Jabatan</span>
                                    <strong class="text-white">Guru Informatika</strong>
                                </div>
                                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700">
                                    <span class="text-slate-400 block text-[11px]">Instansi</span>
                                    <strong class="text-cyan-300">SMP Negeri 2 Kalianda</strong>
                                </div>
                                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700">
                                    <span class="text-slate-400 block text-[11px]">Mata Pelajaran / Kelas</span>
                                    <strong class="text-white">Informatika / Kelas VII (Fase D)</strong>
                                </div>
                                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700">
                                    <span class="text-slate-400 block text-[11px]">Materi & Tahun Pelajaran</span>
                                    <strong class="text-purple-300">Sistem Komputer • 2026/2027</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* =========================================================================
           15. MODAL PETUNJUK PENGGUNAAN & NOTIFIKASI TOAST
           ========================================================================= */
        function openHelpModal() {
            AudioEngine.playClick();
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h3 class="font-display text-2xl font-bold text-cyan-300 mb-3">
                    <i class="fa-solid fa-circle-question mr-1.5"></i> Petunjuk Penggunaan Aplikasi
                </h3>
                <ul class="space-y-2.5 text-xs sm:text-sm text-slate-200 leading-relaxed">
                    <li class="bg-slate-900/80 p-3 rounded-xl"><strong>1. Materi Belajar:</strong> Pelajari 5 subbab Sistem Komputer, klik tombol <em>Dengarkan Materi</em> untuk audio narasi, dan kerjakan kuis mini di setiap akhir bab.</li>
                    <li class="bg-slate-900/80 p-3 rounded-xl"><strong>2. Simulasi Lab:</strong> Klik Keyboard dan ketik kata <code>INFORMATIKA</code> untuk mengamati perjalanan data dari Input, Process, Output, hingga Storage.</li>
                    <li class="bg-slate-900/80 p-3 rounded-xl"><strong>3. Praktikum & Arena Game:</strong> Selesaikan 4 aktivitas praktikum serta 4 game edukatif untuk mengumpulkan bintang dan medali.</li>
                    <li class="bg-slate-900/80 p-3 rounded-xl"><strong>4. LKPD Digital & Evaluasi:</strong> Isi LKPD Digital (bisa dicetak/diunduh) lalu uji kemampuanmu pada 15 soal Evaluasi Akhir.</li>
                    <li class="bg-slate-900/80 p-3 rounded-xl"><strong>5. Pengaturan Suara:</strong> Gunakan tombol Musik, Suara, dan Slider Volume di bagian atas layar sesuai kenyamananmu.</li>
                </ul>
            `;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function showToast(message) {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="text-center py-2">
                    <div class="w-14 h-14 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mb-3">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h4 class="font-display text-lg font-bold text-white mb-2">Info Asisten Robo-KAI</h4>
                    <p class="text-sm text-slate-200 mb-4">${message}</p>
                    <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs">Mengerti</button>
                </div>
            `;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            AudioEngine.playClick();
            document.getElementById('custom-modal').classList.add('hidden');
        }

        /* =========================================================================
           16. INISIALISASI SAAT HALAMAN DIMUAT
           ========================================================================= */
        window.onload = function () {
            updateHeaderStats();
            renderHome(document.getElementById('app-container'));
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
